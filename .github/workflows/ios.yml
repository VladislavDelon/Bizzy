name: Build iOS (simulator)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          pod setup

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS for simulator (no code signing)
        run: flutter build ios --simulator --no-codesign 2>&1 | tee build/build-ios.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-log
          path: build/build-ios.log

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: bizzy-ios-simulator
          path: build/ios/iphonesimulator/*.app

name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore.jks
            printf 'storeFile=release.keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Release signing configured."
          else
            echo "No KEYSTORE_BASE64 secret; using debug signing."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build/build-apk.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-log
          path: build/build-apk.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare release files
        if: always()
        run: |
          mkdir -p release-files
          [ -f build/app/outputs/flutter-apk/app-release.apk ] && cp build/app/outputs/flutter-apk/app-release.apk release-files/app-release.apk
          [ -f build/build-apk.log ] && cp build/build-apk.log release-files/build-apk.log
          ls -lh release-files/

      - name: Create GitHub Release
        if: always() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Bizzy ${{ github.ref_name }}
          files: release-files/*
          generate_release_notes: true

  # Неподписанный iOS-билд: складываем .ipa в тот же релиз рядом с APK.
  # Подписывается локально (Sideloadly/AltStore) или платным dev-аккаунтом.
  build-ios:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (device, no signing)
        run: |
          set -o pipefail
          mkdir -p build
          flutter build ios --release --no-codesign 2>&1 | tee build/build-ios.log

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p Payload release-files
          cp -r "build/ios/iphoneos/Runner.app" Payload/
          zip -r release-files/bizzy-ios-unsigned.ipa Payload
          cp build/build-ios.log release-files/ 2>/dev/null || true
          ls -lh release-files/

      - name: Upload iOS files to release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*

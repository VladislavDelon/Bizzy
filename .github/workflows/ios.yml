name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Неподписанная сборка для устройства. Runner.app потом упаковывается
      # в .ipa, который подписывается локально через Sideloadly/AltStore.
      - name: Build iOS (device, no signing)
        run: |
          set -o pipefail
          mkdir -p build
          flutter build ios --release --no-codesign 2>&1 | tee build/build-ios.log

      # При падении постим хвост лога комментарием к коммиту —
      # логи Actions без логина не прочитать, а комментарий публичный.
      - name: Report build log tail on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 5000 build/build-ios.log > /tmp/ios-tail.txt 2>/dev/null || \
            echo "(no build log)" > /tmp/ios-tail.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/ios-tail.txt)" --jq '.id' || true

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -r "build/ios/iphoneos/Runner.app" Payload/
          zip -r bizzy-ios-unsigned.ipa Payload
          ls -lh bizzy-ios-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-log
          path: build/build-ios.log

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bizzy-ios-unsigned
          path: bizzy-ios-unsigned.ipa
